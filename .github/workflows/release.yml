name: Release

# Builds the prebuilt binaries on every platform, checks that the packed
# tarball installs and works from them alone, and, for a version tag, publishes.
#
# Release: bump "version" in package.json, commit, then push a tag `v<version>`.
# Run by hand (workflow_dispatch) to check the whole pipeline without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Built in Debian 11 (glibc 2.31) so the binary loads on any glibc that Node supports
  prebuild-linux:
    name: Prebuild ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    container: node:22-bullseye
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-latest }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      # Without scripts, so that the tests below load the prebuilt binary
      - run: npm ci --ignore-scripts
      - run: npm run prebuildify
      - run: npm test
      - name: Check the binary needs no newer glibc than Node itself does (2.28)
        run: |
          highest=$(objdump -T prebuilds/${{ matrix.target }}/*.node | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -n 1)
          echo "requires $highest"
          test "$(printf '%s\n' "$highest" GLIBC_2.28 | sort -V | tail -n 1)" = GLIBC_2.28
      - uses: actions/upload-artifact@v7
        with:
          name: prebuilds-${{ matrix.target }}
          path: prebuilds/
          if-no-files-found: error

  prebuild:
    name: Prebuild ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-latest }
          - { target: darwin-x64, os: macos-15-intel }
          - { target: win32-x64, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run prebuildify
      - run: npm test
      - uses: actions/upload-artifact@v7
        with:
          name: prebuilds-${{ matrix.target }}
          path: prebuilds/
          if-no-files-found: error

  # Installs the packed tarball, without running install scripts, on each
  # platform and Node version: only a working prebuilt binary passes.
  smoke:
    name: Install on Node ${{ matrix.node }}, ${{ matrix.os }}
    needs: [prebuild-linux, prebuild]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
        node: [22, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v8
        with:
          pattern: prebuilds-*
          path: prebuilds/
          merge-multiple: true
      - run: npm ci --ignore-scripts
      - run: npm run test:install

  publish:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The tag matches the version in package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v8
        with:
          pattern: prebuilds-*
          path: prebuilds/
          merge-multiple: true
      - run: npm ci --ignore-scripts
      # prepublishOnly refuses to publish unless every prebuild is present
      - run: npm publish --provenance --access public
